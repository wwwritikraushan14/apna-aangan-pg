<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery — Real PG Rooms in Dwarka | Apna Aangan PG</title>
<meta name="description" content="Real photographs of Apna Aangan PG rooms in Dwarka, New Delhi — bedrooms, bathrooms, living areas and balcony. No stock photos: every picture is of the actual property.">
<meta property="og:title" content="Photo Gallery — Apna Aangan PG, Dwarka">
<meta property="og:description" content="Real photos of our PG rooms in Dwarka — bedrooms, bathrooms, living areas and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="section" style="padding:42px 0 16px">
  <div class="container">
    <p class="eyebrow">Real Photographs Only</p>
    <h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">Photo Gallery</h1>
    <p class="muted" style="max-width:680px">Every photograph below was taken at the property and supplied by the owner — no stock images, no AI pictures. Tap any photo to view it full-screen; swipe or use the arrows to browse.</p>
    <div class="gal-chips" id="galChips"></div>
    <div class="gal-grid" id="galGrid"></div>
    <p class="muted small" id="galCount" style="margin-top:14px"></p>
  </div>
</section>
<div class="lightbox" id="lightbox" role="dialog" aria-label="Photo viewer">
  <button class="lb-x" id="lbClose" aria-label="Close">×</button>
  <button class="lb-nav" id="lbPrev" aria-label="Previous photo">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav" id="lbNext" aria-label="Next photo">›</button>
  <p class="lb-cap" id="lbCap"></p>
</div>
<script src="demo-data.js"></script>
<script src="app.js"></script>
<script>
const PHOTOS = [{"src": "room-single.jpg", "cat": "bedrooms", "alt": "Single bedroom with bed, study desk and wardrobe — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-single-2.jpg", "cat": "bedrooms", "alt": "Single bedroom with study desk and window — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-double-1.jpg", "cat": "bedrooms", "alt": "Double-sharing bedroom with two beds — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-double-2.jpg", "cat": "bedrooms", "alt": "Double-sharing bedroom, two single beds with wardrobes — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-double-3.jpg", "cat": "bedrooms", "alt": "Double-sharing bedroom with beds and storage — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-spacious.jpg", "cat": "bedrooms", "alt": "Spacious bedroom with large windows — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-triple-1.jpg", "cat": "bedrooms", "alt": "Triple-sharing bedroom with three beds — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-triple-2.jpg", "cat": "bedrooms", "alt": "Triple-sharing bedroom, view from the door — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-triple-3.jpg", "cat": "bedrooms", "alt": "Triple-sharing bedroom with three beds along the wall — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-quad-1.jpg", "cat": "bedrooms", "alt": "Large group-sharing bedroom with four beds — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-large-1.jpg", "cat": "bedrooms", "alt": "Large shared bedroom with wardrobes — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-large-2.jpg", "cat": "bedrooms", "alt": "Large shared bedroom, wide view — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "room-wardrobe-1.jpg", "cat": "bedrooms", "alt": "Bedroom wardrobe and storage area — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "budget-single-1.jpg", "cat": "bedrooms", "alt": "Single bedroom with desk and wardrobe — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "budget-single-2.jpg", "cat": "bedrooms", "alt": "Single bedroom with wardrobe and mirror — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "budget-single-3.jpg", "cat": "bedrooms", "alt": "Single bedroom with study desk — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "budget-single-4.jpg", "cat": "bedrooms", "alt": "Bright single bedroom with large window — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "budget-single-5.jpg", "cat": "bedrooms", "alt": "Single bedroom, door-side view — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "budget-double-1.jpg", "cat": "bedrooms", "alt": "Double-sharing bedroom with blue accent wall — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "studio-double-1.jpg", "cat": "bedrooms", "alt": "Premium studio bedroom with teal headboards — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "studio-double-2.jpg", "cat": "bedrooms", "alt": "Premium studio bedroom with balcony door — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "studio-double-3.jpg", "cat": "bedrooms", "alt": "Premium studio bedroom, alternate view — Bedroom at Apna Aangan PG, Dwarka, New Delhi"}, {"src": "bathroom.jpg", "cat": "bathrooms", "alt": "Attached bathroom with western WC and shower — Apna Aangan PG, Dwarka"}, {"src": "bathroom-2.jpg", "cat": "bathrooms", "alt": "Bathroom with shower and fittings — Apna Aangan PG, Dwarka"}, {"src": "studio-bathroom-1.jpg", "cat": "bathrooms", "alt": "Premium bathroom with marble-finish tiles — Apna Aangan PG, Dwarka"}, {"src": "studio-living-1.jpg", "cat": "living", "alt": "Living and study area with TV unit and mini-fridge — Apna Aangan PG, Dwarka"}, {"src": "studio-living-2.jpg", "cat": "living", "alt": "Living area with sofa and study desk — Apna Aangan PG, Dwarka"}, {"src": "studio-living-3.jpg", "cat": "living", "alt": "Living area with kitchenette counter — Apna Aangan PG, Dwarka"}, {"src": "studio-balcony-1.jpg", "cat": "balcony", "alt": "Balcony door and outdoor view from the studio room — Apna Aangan PG, Dwarka"}];
const CATS = [['all', 'All Photos'], ['bedrooms', 'Bedrooms'], ['bathrooms', 'Bathrooms'], ['living', 'Living & Common Areas'], ['balcony', 'Balcony']];
let curCat = 'all', curList = [], curIdx = 0;
function renderChips() {
  $('#galChips').innerHTML = CATS.filter(([k]) => k === 'all' || PHOTOS.some(p => p.cat === k)).map(([k, label]) =>
    `<button class="${k === curCat ? 'active' : ''}" onclick="setCat('${k}')">${label} (${k === 'all' ? PHOTOS.length : PHOTOS.filter(p => p.cat === k).length})</button>`).join('');
}
function setCat(k) {
  curCat = k; renderChips();
  curList = PHOTOS.filter(p => k === 'all' || p.cat === k);
  $('#galGrid').innerHTML = curList.map((p, i) => `<figure><img loading="lazy" src="${p.src}" alt="${esc(p.alt)}" onclick="openLb(${i})"></figure>`).join('');
  $('#galCount').textContent = curList.length + ' real photograph' + (curList.length === 1 ? '' : 's') + (k === 'all' ? ' of the property' : ' in this category') + '.';
}
function openLb(i) { curIdx = i; showLb(); $('#lightbox').classList.add('open'); }
function showLb() { const p = curList[curIdx]; $('#lbImg').src = p.src; $('#lbImg').alt = p.alt; $('#lbCap').textContent = p.alt + ' · ' + (curIdx + 1) + ' / ' + curList.length; }
function stepLb(d) { curIdx = (curIdx + d + curList.length) % curList.length; showLb(); }
$('#lbClose').addEventListener('click', () => $('#lightbox').classList.remove('open'));
$('#lbPrev').addEventListener('click', () => stepLb(-1));
$('#lbNext').addEventListener('click', () => stepLb(1));
document.addEventListener('keydown', (e) => { if (!$('#lightbox').classList.contains('open')) return; if (e.key === 'Escape') $('#lightbox').classList.remove('open'); if (e.key === 'ArrowLeft') stepLb(-1); if (e.key === 'ArrowRight') stepLb(1); });
let touchX = null;
$('#lightbox').addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
$('#lightbox').addEventListener('touchend', (e) => { if (touchX === null) return; const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 40) stepLb(dx < 0 ? 1 : -1); touchX = null; }, { passive: true });
(async () => { await aapInit('gallery'); setCat('all'); })();
</script>
</body>
</html>
